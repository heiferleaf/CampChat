name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Build CampChat
        run: dotnet build CampChat/CampChat.csproj -c Release --nologo
      - name: Build the overlay preview
        run: dotnet build CampChat.Preview/CampChat.Preview.csproj -c Release --nologo
      - name: Check room transport
        run: dotnet run --project CampChat.Check/CampChat.Check.csproj -c Release
